name: Ubuntu RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install XFCE, xrdp, and dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xrdp xorgxrdp xserver-xorg-core \
            xfce4 xfce4-goodies xfce4-terminal \
            dbus-x11 x11-xserver-utils

      - name: Disable gnome-remote-desktop to free port 3389
        run: |
          sudo systemctl stop gnome-remote-desktop 2>/dev/null || true
          sudo systemctl disable gnome-remote-desktop 2>/dev/null || true
          sudo ss -tlnp | grep 3389 && echo "WARNING: port 3389 still in use" || true

      - name: Fix xrdp startup for Ubuntu 24.04 (prevent black screen)
        run: |
          # درج فقط در صورت عدم وجود (جلوگیری از تکرار در rerun)
          if ! grep -q 'unset DBUS_SESSION_BUS_ADDRESS' /etc/xrdp/startwm.sh; then
            sudo sed -i '/test -x \/etc\/X11\/Xsession/i unset DBUS_SESSION_BUS_ADDRESS\nunset XDG_RUNTIME_DIR' /etc/xrdp/startwm.sh
          fi
          grep -n 'unset DBUS_SESSION_BUS_ADDRESS' /etc/xrdp/startwm.sh || true

      - name: Create RDP user and configure XFCE session
        run: |
          PASSWORD=$(tr -dc 'A-Za-z0-9!@#$%^&*()_+' < /dev/urandom | head -c 16)
          echo "::add-mask::$PASSWORD"   # برای دیدن پسورد در لاگ، این خط را کامنت کنید

          sudo useradd -m -s /bin/bash -G sudo RDP
          echo "RDP:$PASSWORD" | sudo chpasswd

          echo "startxfce4" | sudo tee /home/RDP/.xsession
          sudo chmod +x /home/RDP/.xsession
          sudo chown RDP:RDP /home/RDP/.xsession

          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Configure xrdp and start service
        run: |
          sudo adduser xrdp ssl-cert || true
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp
          sudo systemctl status xrdp --no-pager || true

      - name: Install and start Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --hostname=gh-runner-$GITHUB_RUN_ID

          TS_IP=""
          for i in $(seq 1 10); do
            TS_IP=$(sudo tailscale ip -4 2>/dev/null | head -n1 || true)
            [ -n "$TS_IP" ] && break
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"
            sudo tailscale status || true
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify RDP Accessibility (без nc)
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          # بررسی پورت بدون وابستگی به nc
          if timeout 5 bash -c "</dev/tcp/$TAILSCALE_IP/3389" 2>/dev/null; then
            echo "TCP connectivity successful!"
          else
            echo "TCP connection to RDP port 3389 failed"
            sudo ss -tlnp | grep 3389 || true
            sudo systemctl status xrdp --no-pager || true
            exit 1
          fi

      - name: Maintain Connection
        run: |
          echo "=== RDP ACCESS ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: RDP"
          echo "Password: (masked in logs)"   # اگر add-mask کامنت شده، این خط را به $RDP_PASSWORD تغییر دهید
          echo "=================="

          while true; do
            echo "[$(date)] RDP Active"
            sleep 300
          done
